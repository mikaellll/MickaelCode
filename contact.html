<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

     <!-- below is the link of font awesome icon  -->

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" media="screen and (max-device-width: 608px)" href="css/tablet.css">
    <link rel="stylesheet" media="screen and (max-device-width: 502px)" href="css/phone.css">
</head>

<body>

    <div id="container">

        <!--      creating navigation menu        -->
        <div class="navbar">
            <div id="nav">
                <ul class="links">
                    <li><a href="index.html">HOME</a></li>
                    <li><a href="about.html">ABOUT</a></li>
                    <li><a href="work.html">WORK</a></li>
                    <li><a href="skills.html">SKILL</a></li>
                    <li><a href="contact.html">CONTACT</a></li>

                </ul>
            </div>

        </div>
        <!-- creating hamburger icon        -->
        <div class="burger">
            <div class="line1"></div>
            <div class="line2"></div>
            <div class="line3"></div>
        </div>


        <!-- adding social media icons     -->
        <div id="follow">
            <i class="fa fa-linkedin" aria-hidden="true"></i><br>
            <i class="fa fa-github" aria-hidden="true"></i><br>
            <i class="fa fa-twitter" aria-hidden="true"></i>
        </div>
        <div id="develop">DEVELOP</div>
        <div id="web">WEB</div>

        <div id="fullstack">Full-stack</div>
        <!-- this box contain some information    -->
        

        <div id="square1"></div>
        <div id="square2"></div>
        
        
        <!-- Adding profile image in background -->
        <div id="pic">
            
        </div>


    </div>

    <!-- javascript for functioning of sidebar menu  -->
    <script>

        const slide = () => {
            const burger = document.querySelector('.burger');
            const nav = document.querySelector('.navbar');
            const navlinks = document.querySelectorAll('.links li');
            burger.addEventListener('click', () => {
                nav.classList.toggle('navbaract');

                navlinks.forEach((link, index) => {

                    if (link.style.animation) {
                        link.style.animation = '';
                    }
                    else {
                        link.style.animation = `navlinkfade 4s ease backwards ${index / 10}s`;
                    }
                });
            });
        }
        slide();

    </script>

</body>

</html>
