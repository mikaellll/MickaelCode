{% extends "base.html" %}

{% block title %}Mot de passe mis à jour | MickaelCode{% endblock %}

{% block content %}
<div class="content-narrow" style="padding-top: 60px; padding-bottom: 70px; text-align:center;">
    <div class="glass-card" style="padding: 40px;">
        <i class="fa fa-check-circle" style="font-size:48px; color:var(--accent-cyan); margin-bottom:16px;"></i>
        <h1 style="font-size:28px; margin-bottom:12px;">Mot de passe réinitialisé !</h1>
        <p style="color:var(--text-muted); font-size:15px; margin-bottom:28px;">
            Votre mot de passe a été mis à jour avec succès. Vous pouvez maintenant vous connecter à votre compte.
        </p>
        <a href="{% url 'accounts:login' %}" class="btn btn-cyan">Se connecter</a>
    </div>
</div>
{% endblock %}
