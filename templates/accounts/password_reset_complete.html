{% extends "base.html" %}

{% block title %}Mot de passe mis à jour | MickaelCode{% endblock %}

{% block content %}
<div class="max-w-md mx-auto px-4 py-16 text-center">
    <div class="glass-card p-8 md:p-10 border border-white/10 rounded-2xl bg-neutral-900/60 backdrop-blur-md">
        <i class="fa fa-check-circle text-5xl text-cyan mb-4 block" aria-hidden="true"></i>
        <h1 class="text-2xl md:text-3xl font-righteous text-white mb-3">Mot de passe réinitialisé !</h1>
        <p class="text-neutral-400 text-sm mb-8 leading-relaxed">
            Votre mot de passe a été mis à jour avec succès. Vous pouvez maintenant vous connecter à votre compte.
        </p>
        <a href="{% url 'accounts:login' %}" class="inline-block px-8 py-3 rounded-full font-righteous text-sm text-black bg-cyan hover:bg-tomato hover:text-white transition-all shadow-[0_0_15px_rgba(0,255,255,0.3)]">
            Se connecter
        </a>
    </div>
</div>
{% endblock %}
