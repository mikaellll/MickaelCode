{% extends "base.html" %}

{% block title %}Réinitialisation de mot de passe | MickaelCode{% endblock %}

{% block content %}
<div class="max-w-md mx-auto px-4 py-16">
    <div class="glass-card p-8 md:p-10 border border-white/10 rounded-2xl bg-neutral-900/60 backdrop-blur-md">
        <h1 class="text-2xl md:text-3xl font-righteous text-cyan mb-3 text-center">Mot de passe oublié ?</h1>
        <p class="text-neutral-400 text-sm text-center mb-8">
            Saisissez votre adresse email enregistrée. Nous vous enverrons un lien sécurisé pour définir un nouveau mot de passe.
        </p>

        <form method="post">
            {% csrf_token %}
            <div class="mb-6">
                <label for="id_email" class="block text-xs uppercase tracking-wider text-neutral-400 font-semibold mb-2">Votre adresse e-mail</label>
                <input type="email" name="email" class="w-full bg-[#121212] border border-neutral-800 focus:border-cyan focus:ring-1 focus:ring-cyan focus:bg-[#181818] rounded-md px-3.5 py-3 text-white text-sm outline-none transition-all" required id="id_email" placeholder="nom@exemple.com">
            </div>

            <button type="submit" class="w-full inline-block px-6 py-3 rounded-full font-righteous text-sm text-black bg-cyan hover:bg-tomato hover:text-white transition-all shadow-[0_0_15px_rgba(0,255,255,0.3)]">
                Envoyer les instructions
            </button>
        </form>
    </div>
</div>
{% endblock %}
