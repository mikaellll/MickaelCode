{% extends "base.html" %}

{% block title %}Réinitialisation de mot de passe | MickaelCode{% endblock %}

{% block content %}
<div class="content-narrow" style="padding-top: 50px; padding-bottom: 70px;">
    <div class="glass-card" style="padding: 40px;">
        <h1 style="font-size:28px; color:var(--accent-cyan); margin-bottom:12px; text-align:center;">Mot de passe oublié ?</h1>
        <p style="color:var(--text-muted); font-size:15px; text-align:center; margin-bottom:28px;">
            Saisissez votre adresse email enregistrée. Nous vous enverrons un lien sécurisé pour définir un nouveau mot de passe.
        </p>

        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label for="id_email" class="form-label">Votre adresse e-mail</label>
                <input type="email" name="email" class="form-control" required id="id_email" placeholder="nom@exemple.com">
            </div>

            <div style="margin-top:24px;">
                <button type="submit" class="btn btn-cyan btn-block">Envoyer les instructions</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
