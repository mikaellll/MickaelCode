{% load static %}
<div class="navbar" id="site-navbar">
    <div id="nav">
        <ul class="links">
            <li><a href="{% url 'core:home' %}" class="{% if request.resolver_match.url_name == 'home' %}nvg{% endif %}">HOME</a></li>
            <li><a href="{% url 'core:about' %}" class="{% if request.resolver_match.url_name == 'about' %}nvg{% endif %}">ABOUT</a></li>
            <li><a href="{% url 'core:work' %}" class="{% if request.resolver_match.url_name == 'work' or request.resolver_match.url_name == 'project_detail' %}nvg{% endif %}">WORK</a></li>
            <li><a href="{% url 'core:skills' %}" class="{% if request.resolver_match.url_name == 'skills' %}nvg{% endif %}">SKILL</a></li>
            <li><a href="{% url 'blog:post_list' %}" class="{% if 'blog' in request.resolver_match.namespaces %}nvg{% endif %}">BLOG</a></li>
            <li><a href="{% url 'courses:course_list' %}" class="{% if 'courses' in request.resolver_match.namespaces %}nvg{% endif %}">FORMATIONS</a></li>
            <li><a href="{% url 'core:contact' %}" class="{% if request.resolver_match.url_name == 'contact' %}nvg{% endif %}">CONTACT</a></li>
            {% if user.is_authenticated %}
            <li><a href="{% url 'dashboard:overview' %}" class="{% if 'dashboard' in request.resolver_match.namespaces %}nvg{% endif %}">DASHBOARD</a></li>
            <li><a href="{% url 'accounts:logout' %}">LOGOUT</a></li>
            {% else %}
            <li><a href="{% url 'accounts:login' %}" class="{% if request.resolver_match.url_name == 'login' %}nvg{% endif %}">SIGN IN</a></li>
            <li><a href="{% url 'accounts:signup' %}" class="{% if request.resolver_match.url_name == 'signup' %}nvg{% endif %}">SIGN UP</a></li>
            {% endif %}
        </ul>
    </div>
</div>

<div class="burger" id="burger-menu-btn" aria-label="Menu">
    <div class="line1"></div>
    <div class="line2"></div>
    <div class="line3"></div>
</div>
