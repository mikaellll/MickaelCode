{% load static %}
<!DOCTYPE html>
<html lang="fr" class="dark">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Mickael developpeur web, wordpress, django, python, react.js, vue.js" />
    <title>Mickael</title>
    <!-- Font awesome icon -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,300;0,400;0,700;1,300&family=Righteous&family=Roboto:wght@700;900&display=swap" rel="stylesheet">
    <!-- Tailwind CSS (compiled bundle) -->
    <link rel="stylesheet" href="{% static 'css/tailwind.css' %}">
</head>

<body class="bg-black text-white font-lato overflow-x-hidden">

    <div id="container" class="relative w-full h-screen overflow-hidden bg-black">

        <!-- Navigation Menu -->
        {% include "includes/navbar.html" %}

        <!-- Social Media Icons -->
        <div id="follow" class="fixed top-1/2 -translate-y-1/2 right-5 sm:right-6 z-30 text-center max-[768px]:hidden flex flex-col items-center gap-3">
            <a href="{{ LINKEDIN_URL }}" target="_blank" rel="noopener noreferrer" class="text-white hover:text-[#00FFFF] hover:scale-115 transition-all text-[32px] block" aria-label="LinkedIn"><i class="fa fa-linkedin" aria-hidden="true"></i></a>
            <a href="{{ GITHUB_URL }}" target="_blank" rel="noopener noreferrer" class="text-white hover:text-[#00FFFF] hover:scale-115 transition-all text-[32px] block" aria-label="GitHub"><i class="fa fa-github" aria-hidden="true"></i></a>
            <a href="{{ TWITTER_URL }}" target="_blank" rel="noopener noreferrer" class="text-white hover:text-[#00FFFF] hover:scale-115 transition-all text-[32px] block" aria-label="Twitter"><i class="fa fa-twitter" aria-hidden="true"></i></a>
        </div>

        <!-- Background Typography Elements -->
        <div id="develop" class="absolute -top-[162px] left-[1005px] text-[#565656]/15 text-[218px] font-black font-roboto select-none pointer-events-none z-0 max-[608px]:hidden">DEVELOP</div>
        <div id="web" class="absolute top-[145px] left-[23px] text-[#565656]/15 text-[218px] font-black font-roboto select-none pointer-events-none z-0 max-[608px]:text-[120px] max-[608px]:top-[80px]">WEB</div>
        <div id="dev" class="absolute top-[355px] left-[23px] text-[#565656]/15 text-[218px] font-black font-roboto select-none pointer-events-none z-0 max-[608px]:text-[80px] max-[608px]:top-[180px]">DEVELOPER</div>
        <div id="fullstack" class="absolute top-[568px] left-[23px] w-[1042px] text-[#565656]/15 text-[218px] font-black font-roboto select-none pointer-events-none z-0 max-[608px]:hidden">Full-stack</div>

        <!-- Decorative Rotating Squares -->
        <div id="square1" class="absolute top-[529px] -left-[192px] w-[410px] h-[345px] border-2 border-[#00FFFF]/15 rotate-[23deg] pointer-events-none z-0"></div>
        <div id="square2" class="absolute top-[12px] left-[90%] w-[215px] h-[232px] border-2 border-[#00FFFF]/15 rotate-[23deg] pointer-events-none z-0"></div>

        <!-- Information Hero Box -->
        <div id="box1" class="absolute top-[203px] left-[13vw] max-[608px]:top-[153px] max-[608px]:left-[6vw] max-[502px]:left-[1vw] text-white z-10 pointer-events-auto">
            <div id="web2" class="text-[175px] max-[608px]:text-[140px] font-righteous leading-none">
                Web<span id="dev2" class="block text-[55px] max-[608px]:text-[49px] tracking-[23px] max-[608px]:tracking-[10px] pl-[15px] font-righteous leading-tight">Developer</span>
            </div>

            <!-- Group: Lateral Cyan Bar bordering the 3 lines of text -->
            <div class="flex items-stretch gap-2.5 pl-[18px] mt-4">
                <!-- Lateral Cyan Bar -->
                <div id="vl" class="w-[1.5px] bg-[#00FFFF] flex-shrink-0"></div>

                <!-- Text group directly beside the lateral bar -->
                <div class="flex flex-col justify-center">
                    <div id="hello" class="text-[15px] font-lato text-white leading-tight">Hello,</div>
                    <div id="me" class="text-[21px] font-lato text-white leading-tight mt-0.5">I'm <span id="rks" class="text-[#ff6347]">Mickael</span></div>
                    <div id="fullstackdev" class="text-[37px] max-[608px]:text-[24px] font-righteous text-white leading-tight mt-1">
                        Full-stack <span id="webdev22" class="text-[#ff6347]">Web Developer</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Contact Button -->
        <button id="btncontact" type="button" onclick="location.href='{% url 'core:contact' %}'" class="absolute top-[595px] left-[15vw] max-[608px]:top-[564px] max-[608px]:left-[9.8vw] max-[502px]:top-[576px] max-[502px]:left-[6vw] max-[502px]:w-[108px] max-[502px]:h-[30px] w-[141px] h-[33px] border-2 border-[#00FFFF] text-black bg-[#00FFFF] hover:bg-[#ff6347] hover:border-[#ff6347] hover:text-white font-righteous rounded-full cursor-pointer z-10 transition-all text-sm tracking-wide">
            contact
        </button>

        <!-- Profile Image in Background -->
        <div id="pic" class="pointer-events-none">
            <style>
                @media (min-width: 1024px) {
                    #pic img {
                        width: 700px !important;
                        height: 700px !important;
                        top: 40px !important;
                        right: 20px !important;
                    }
                }
            </style>
            <img src="{% static 'img/profil_portfolio.png' %}" alt="image_profil" class="absolute top-0 h-full w-auto max-w-none object-cover opacity-75 hero-mobile-pic lg:opacity-100 lg:top-[40px] lg:right-[20px] lg:w-[700px] lg:h-[700px] lg:rounded-[44px]">
        </div>

    </div>

    <!-- Script for mobile menu -->
</body>

</html>
