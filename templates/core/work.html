{% load static %}
<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mickael</title>
     <!-- below is the link of font awesome icon  -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="{% static 'css/style.css' %}?v=20261023">
    <link rel="stylesheet" media="screen and (max-device-width: 608px)" href="{% static 'css/tablet.css' %}?v=20261023">
    <link rel="stylesheet" media="screen and (max-device-width: 502px)" href="{% static 'css/phone.css' %}?v=20261023">
    <style>
        #nav ul li { width: auto !important; margin-inline: 10px !important; white-space: nowrap !important; }
        #nav ul li a.signin-btn {
            display: inline-block !important;
            border: 1.5px solid #00FFFF !important;
            border-radius: 20px !important;
            padding: 3px 14px !important;
            color: #00FFFF !important;
            font-size: 13px !important;
            letter-spacing: 0.8px !important;
            white-space: nowrap !important;
            text-decoration: none !important;
            transition: all 0.3s ease !important;
        }
        #nav ul li a.signin-btn:hover {
            background-color: #ff6347 !important;
            border-color: #ff6347 !important;
            color: #ffffff !important;
            box-shadow: 0 0 12px rgba(255, 99, 71, 0.4) !important;
        }
        #nav ul li a.signin-btn:after { display: none !important; }
    </style>
</head>

<body>

    <div id="container">

        <!--      creating navigation menu        -->
        <div class="navbar">
            <div id="nav">
                <ul class="links">
                    <li><a href="{% url 'core:home' %}">HOME</a></li>
                    <li><a href="{% url 'core:about' %}">ABOUT</a></li>
                    <li><a href="{% url 'core:work' %}" class="nvg">WORK</a></li>
                    <li><a href="{% url 'core:skills' %}">SKILL</a></li>
                    <li><a href="{% url 'blog:post_list' %}">BLOG</a></li>
                    <li><a href="{% url 'courses:course_list' %}">FORMATIONS</a></li>
                    <li><a href="{% url 'core:contact' %}">CONTACT</a></li>
                    {% if user.is_authenticated %}
                    <li><a href="{% url 'dashboard:overview' %}">DASHBOARD</a></li>
                    <li><a href="{% url 'accounts:logout' %}">LOGOUT</a></li>
                    {% else %}
                    <li><a href="{% url 'accounts:login' %}" class="signin-btn">SIGN IN</a></li>
                    {% endif %}
                </ul>
            </div>

        </div>
        <!-- creating hamburger icon        -->
        <div class="burger">
            <div class="line1"></div>
            <div class="line2"></div>
            <div class="line3"></div>
        </div>


        <!-- adding social media icons     -->
        <div id="follow">
            <a href="{{ LINKEDIN_URL }}" target="_blank" rel="noopener noreferrer" style="color:inherit;"><i class="fa fa-linkedin" aria-hidden="true"></i></a><br>
            <a href="{{ GITHUB_URL }}" target="_blank" rel="noopener noreferrer" style="color:inherit;"><i class="fa fa-github" aria-hidden="true"></i></a><br>
            <a href="{{ TWITTER_URL }}" target="_blank" rel="noopener noreferrer" style="color:inherit;"><i class="fa fa-twitter" aria-hidden="true"></i></a>
        </div>
        <div id="develop">DEVELOP</div>
        <div id="web">WEB</div>
        <div id="dev">DEVELOPER</div>
        <div id="fullstack">Full-stack</div>
        <!-- this box contain some information    -->
        

        <div id="square1"></div>
        <div id="square2"></div>
        
        
        <!-- Adding profile image in background -->
        <div id="pic">
            
        </div>


    </div>

    <!-- javascript for functioning of sidebar menu  -->
    <script>

        const slide = () => {
            const burger = document.querySelector('.burger');
            const nav = document.querySelector('.navbar');
            const navlinks = document.querySelectorAll('.links li');
            burger.addEventListener('click', () => {
                nav.classList.toggle('navbaract');

                navlinks.forEach((link, index) => {

                    if (link.style.animation) {
                        link.style.animation = '';
                    }
                    else {
                        link.style.animation = `navlinkfade 4s ease backwards ${index / 10}s`;
                    }
                });
            });
        }
        slide();

    </script>

</body>

</html>
