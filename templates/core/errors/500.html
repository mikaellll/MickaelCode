<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Erreur Serveur (500) | MickaelCode</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Righteous&family=Lato&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Lato', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .card {
            background: rgba(16, 22, 30, 0.9);
            border: 1px solid rgba(255, 99, 71, 0.4);
            border-radius: 16px;
            padding: 50px 30px;
            text-align: center;
            max-width: 550px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
        }
        h1 {
            font-family: 'Righteous', cursive;
            font-size: 72px;
            color: #ff6347;
            margin: 0 0 16px;
        }
        p {
            color: #a0a0a0;
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 28px;
        }
        a {
            background-color: #00FFFF;
            color: #000000;
            text-decoration: none;
            padding: 12px 28px;
            border-radius: 50px;
            font-family: 'Righteous', cursive;
            font-size: 15px;
            display: inline-block;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>500</h1>
        <h2>Une erreur inattendue est survenue</h2>
        <p>Notre équipe a été notifiée et travaille activement à sa résolution. Merci de patienter quelques instants.</p>
        <a href="/">Retour à l'accueil</a>
    </div>
</body>
</html>
