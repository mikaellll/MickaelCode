<div class="flex items-center gap-2 md:gap-3 overflow-x-auto pb-4 mb-8 border-b border-white/10">
    <a href="{% url 'dashboard:overview' %}" class="px-4 py-2 rounded-full text-xs md:text-sm font-medium whitespace-nowrap transition-all inline-flex items-center gap-2 {% if active_tab == 'overview' %}bg-cyan/15 text-cyan border border-cyan/40 shadow-[0_0_12px_rgba(0,255,255,0.2)]{% else %}text-neutral-400 hover:text-white hover:bg-neutral-900 border border-transparent{% endif %}">
        <i class="fa fa-th-large" aria-hidden="true"></i> Vue d'ensemble
    </a>
    <a href="{% url 'dashboard:my_courses' %}" class="px-4 py-2 rounded-full text-xs md:text-sm font-medium whitespace-nowrap transition-all inline-flex items-center gap-2 {% if active_tab == 'courses' %}bg-cyan/15 text-cyan border border-cyan/40 shadow-[0_0_12px_rgba(0,255,255,0.2)]{% else %}text-neutral-400 hover:text-white hover:bg-neutral-900 border border-transparent{% endif %}">
        <i class="fa fa-graduation-cap" aria-hidden="true"></i> Mes Formations ({{ ENROLLED_COURSES_COUNT }})
    </a>
    <a href="{% url 'dashboard:my_learning' %}" class="px-4 py-2 rounded-full text-xs md:text-sm font-medium whitespace-nowrap transition-all inline-flex items-center gap-2 {% if active_tab == 'learning' %}bg-cyan/15 text-cyan border border-cyan/40 shadow-[0_0_12px_rgba(0,255,255,0.2)]{% else %}text-neutral-400 hover:text-white hover:bg-neutral-900 border border-transparent{% endif %}">
        <i class="fa fa-line-chart" aria-hidden="true"></i> Mon Apprentissage
    </a>
    <a href="{% url 'dashboard:my_purchases' %}" class="px-4 py-2 rounded-full text-xs md:text-sm font-medium whitespace-nowrap transition-all inline-flex items-center gap-2 {% if active_tab == 'purchases' %}bg-cyan/15 text-cyan border border-cyan/40 shadow-[0_0_12px_rgba(0,255,255,0.2)]{% else %}text-neutral-400 hover:text-white hover:bg-neutral-900 border border-transparent{% endif %}">
        <i class="fa fa-credit-card" aria-hidden="true"></i> Mes Commandes
    </a>
    <a href="{% url 'accounts:profile' %}" class="px-4 py-2 rounded-full text-xs md:text-sm font-medium whitespace-nowrap transition-all inline-flex items-center gap-2 {% if active_tab == 'profile' %}bg-cyan/15 text-cyan border border-cyan/40 shadow-[0_0_12px_rgba(0,255,255,0.2)]{% else %}text-neutral-400 hover:text-white hover:bg-neutral-900 border border-transparent{% endif %}">
        <i class="fa fa-user" aria-hidden="true"></i> Mon Profil
    </a>
    <a href="{% url 'dashboard:notifications' %}" class="px-4 py-2 rounded-full text-xs md:text-sm font-medium whitespace-nowrap transition-all inline-flex items-center gap-2 {% if active_tab == 'notifications' %}bg-cyan/15 text-cyan border border-cyan/40 shadow-[0_0_12px_rgba(0,255,255,0.2)]{% else %}text-neutral-400 hover:text-white hover:bg-neutral-900 border border-transparent{% endif %}">
        <i class="fa fa-bell" aria-hidden="true"></i> Notifications
        {% if UNREAD_NOTIFICATIONS_COUNT > 0 %}
            <span class="inline-flex items-center justify-center px-1.5 py-0.5 rounded-full text-[10px] font-bold bg-tomato text-white ml-1">{{ UNREAD_NOTIFICATIONS_COUNT }}</span>
        {% endif %}
    </a>
</div>
